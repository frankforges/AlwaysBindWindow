name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # frank fork: Windows only. The macOS/Linux code is upstream's and untested here.
        include:
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: always-bind-window.exe
            asset_name: AlwaysBindWindow-windows-x64.exe

          # Windows ARM64
          - os: windows-latest
            target: aarch64-pc-windows-msvc
            artifact_name: always-bind-window.exe
            asset_name: AlwaysBindWindow-windows-arm64.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare artifact (Windows)
        run: |
          copy target\${{ matrix.target }}\release\${{ matrix.artifact_name }} ${{ matrix.asset_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | head -20

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          body: |
            Windows build of the **frank fork** of [XR-stb/AlwaysBindWindow](https://github.com/XR-stb/AlwaysBindWindow). It's the upstream tool plus fixes for grouping *some* windows of a multi-window app:

            - Only the windows you lasso are bound. Other windows of the same app stay independent.
            - Grouped windows move together only when you drag a window itself. Dragging inside a window (e.g. panning a chart) or resizing it no longer moves the group.

            See [`docs/DECISIONS.md`](https://github.com/frankforges/AlwaysBindWindow/blob/main/docs/DECISIONS.md) for details.

            ## Downloads

            | Architecture | File |
            |--------------|------|
            | x64 (most PCs) | `AlwaysBindWindow-windows-x64.exe` |
            | ARM64 | `AlwaysBindWindow-windows-arm64.exe` |

            Always-latest link: `https://github.com/frankforges/AlwaysBindWindow/releases/latest/download/AlwaysBindWindow-windows-x64.exe`

            ### Quick Start
            1. Download the `.exe` and run it. It starts as a tray icon.
            2. The exe is not code-signed, so Windows SmartScreen may warn on first run: click **More info → Run anyway**.
            3. Press `Ctrl+Alt+G` and drag a rectangle over the windows to bind. Tight rectangles avoid picking up extra windows.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
